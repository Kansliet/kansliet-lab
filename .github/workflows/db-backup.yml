# Weekly backup of the production database (Neon `main`), because the Neon
# Free plan only keeps 6 hours of history. The repo is public, so the dump is
# encrypted (GPG, AES-256, passphrase in a secret) before it is stored as a
# workflow artifact for 90 days. Restore: docs/store/RUNBOOK.md, "Backups".
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   BACKUP_DATABASE_URL  Neon `main`, the direct (unpooled) connection string
#   BACKUP_PASSPHRASE    a long random passphrase, also kept in your password manager
name: Database backup

on:
  schedule:
    - cron: "0 3 * * 0" # Sundays 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the secrets are set
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::error::Set BACKUP_DATABASE_URL and BACKUP_PASSPHRASE in the repository secrets."
            exit 1
          fi

      # pg_dump must be at least the server's major version (Neon runs Postgres 18).
      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          name="kansliet-$(date -u +%Y-%m-%d)"
          docker run --rm -e DATABASE_URL postgres:18-alpine \
            sh -c 'pg_dump "$DATABASE_URL" --no-owner --no-privileges -Fc' > "$name.dump"
          test -s "$name.dump"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 -o "$name.dump.gpg" "$name.dump" 3<<<"$PASSPHRASE"
          rm "$name.dump"
          ls -l "$name.dump.gpg"
          echo "BACKUP_NAME=$name" >> "$GITHUB_ENV"

      - name: Store for 90 days
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_NAME }}
          path: ${{ env.BACKUP_NAME }}.dump.gpg
          retention-days: 90
          if-no-files-found: error
