name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Build must succeed without secrets (RESEND_API_KEY is read only at
          # request time). A dummy GA id keeps the analytics render path covered.
          NEXT_PUBLIC_GA_ID: G-TEST000000
